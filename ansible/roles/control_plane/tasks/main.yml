- name: Apply Flannel CNI
  become: true
  become_user: "{{ ansible_user }}"
  ansible.builtin.command: kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
  register: control_plane_flannel_result
  changed_when: "'created' in control_plane_flannel_result.stdout or 'configured' in control_plane_flannel_result.stdout"

- name: Create join command
  ansible.builtin.command: kubeadm token create --print-join-command
  register: control_plane_join_command_raw
  changed_when: false

- name: Store join command as fact
  ansible.builtin.set_fact:
    control_plane_join_command: "{{ control_plane_join_command_raw.stdout }}"
  delegate_to: "{{ item }}"
  delegate_facts: true
  loop: "{{ groups['k8s_cluster'] }}"
